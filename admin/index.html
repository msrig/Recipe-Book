<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Рецепты нашей семьи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/style.css">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>
                    <i class="fas fa-utensils"></i>
                    Админка
                </h2>
            </div>

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" href="/admin/index.html">
                        <i class="fas fa-home"></i>
                        <span>Главная</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/create-recipe.html">
                        <i class="fas fa-plus-circle"></i>
                        <span>Новый рецепт</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="showRecipesList()">
                        <i class="fas fa-list"></i>
                        <span>Все рецепты</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="showCategories()">
                        <i class="fas fa-tags"></i>
                        <span>Категории</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="fas fa-arrow-left"></i>
                        <span>Вернуться на сайт</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Выход</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="top-bar-left">
                    <button type="button" class="toggle-sidebar" onclick="toggleSidebar()" aria-label="Открыть меню">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>Админ</h1>
                </div>
                <div class="top-bar-right">
                    <a class="btn-site" href="/">
                        <i class="fas fa-arrow-left"></i>
                        <span class="site-link-text">Вернуться на сайт</span>
                    </a>
                    <span id="username" class="username">admin</span>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content">
                <!-- Dashboard Section -->
                <div id="dashboardSection" class="section">
                    <h2>
                        <i class="fas fa-chart-bar"></i>
                        Обзор
                    </h2>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-book"></i>
                            </div>
                            <div class="stat-content">
                                <h3>Всего рецептов</h3>
                                <p class="stat-value" id="totalRecipes">0</p>
                            </div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-list"></i>
                            </div>
                            <div class="stat-content">
                                <h3>Категории</h3>
                                <p class="stat-value" id="totalCategories">0</p>
                            </div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-globe"></i>
                            </div>
                            <div class="stat-content">
                                <h3>Страны</h3>
                                <p class="stat-value" id="totalCountries">0</p>
                            </div>
                        </div>
                    </div>

                    <div class="quick-actions">
                        <h3>Быстрые действия</h3>
                        <a href="/admin/create-recipe.html" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Добавить новый рецепт
                        </a>
                        <button class="btn btn-secondary" onclick="showRecipesList()">
                            <i class="fas fa-eye"></i> Просмотреть все рецепты
                        </button>
                    </div>
                </div>

                <!-- Recipes List Section -->
                <div id="recipesListSection" class="section" style="display: none;">
                    <h2>
                        <i class="fas fa-list"></i>
                        Все рецепты
                    </h2>

                    <div id="recipesList" class="recipes-table">
                        <p class="text-muted">Загрузка...</p>
                    </div>
                </div>

                <!-- Categories Section -->
                <div id="categoriesSection" class="section" style="display: none;">
                    <h2>
                        <i class="fas fa-tags"></i>
                        Категории
                    </h2>

                    <div id="categoriesList" class="categories-list"></div>

                    <div class="add-category-form">
                        <h3>Добавить новую категорию</h3>
                        <div class="input-group">
                            <input
                                type="text"
                                id="categoryInput"
                                class="form-control"
                                placeholder="Введите название категории"
                            >
                            <button class="btn btn-primary" onclick="addCategory()">
                                <i class="fas fa-plus"></i> Добавить
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/country-utils.js"></script>
    <script src="/admin/js/api-client.js"></script>
    <script>
        function getImageUrl(imagePath, updatedAt = null) {
            if (!imagePath) return "";

            let resolved = imagePath;
            if (!(imagePath.startsWith("http") || imagePath.startsWith("/") || imagePath.startsWith("data:"))) {
                const prefix = api.baseURL ? `${api.baseURL.replace(/\/$/, "")}/` : "/";
                resolved = `${prefix}${imagePath}`;
            }

            if (updatedAt) {
                const separator = resolved.includes("?") ? "&" : "?";
                resolved = `${resolved}${separator}v=${encodeURIComponent(updatedAt)}`;
            }

            return resolved;
        }

        // Initialize dashboard
        async function initDashboard() {
            try {
                // Check authentication
                await api.verifyToken();

                // Load statistics
                const recipes = await api.getRecipes();
                const categories = await api.getCategories();
                const countries = await api.getCountries();

                document.getElementById("totalRecipes").textContent = recipes.recipes.length;
                document.getElementById("totalCategories").textContent = categories.categories.length;
                document.getElementById("totalCountries").textContent = countries.countries.length;

            } catch (error) {
                console.error("Auth error:", error);
                window.location.href = "/admin/login.html";
            }
        }

        async function showRecipesList() {
            document.getElementById("dashboardSection").style.display = "none";
            document.getElementById("categoriesSection").style.display = "none";
            document.getElementById("recipesListSection").style.display = "block";

            try {
                const result = await api.getRecipes();
                const recipes = result.recipes;

                if (recipes.length === 0) {
                    document.getElementById("recipesList").innerHTML = `
                        <p class="text-muted">Нет рецептов. <a href="/admin/create-recipe.html">Создать первый рецепт</a></p>
                    `;
                    return;
                }

                let html = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Фото</th>
                                <th>Название</th>
                                <th>Категория</th>
                                <th>Страна</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                recipes.forEach(recipe => {
                    const imageUrl = getImageUrl(recipe.image, recipe.updated_at);
                    html += `
                        <tr>
                            <td style="width: 92px;">
                                <img
                                    src="${imageUrl}"
                                    alt="${recipe.title}"
                                    style="width: 72px; height: 54px; object-fit: cover; border-radius: 8px; border: 1px solid #e4e7ea;"
                                    onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<span style=&quot;color:#9aa4af; font-size:0.8rem;&quot;>нет фото</span>');"
                                >
                            </td>
                            <td>${recipe.title}</td>
                            <td><span class="badge bg-primary">${recipe.category}</span></td>
                            <td>${recipe.country_origin} ${findCountryFlag(recipe.country_code)}</td>
                            <td>
                                <a href="/admin/edit-recipe.html?id=${recipe.id}" class="btn btn-sm btn-warning">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <button class="btn btn-sm btn-danger" onclick="deleteRecipe('${recipe.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;

                document.getElementById("recipesList").innerHTML = html;

            } catch (error) {
                document.getElementById("recipesList").innerHTML = `
                    <p class="text-danger">Ошибка загрузки: ${error.message}</p>
                `;
            }
        }

        async function showCategories() {
            document.getElementById("dashboardSection").style.display = "none";
            document.getElementById("recipesListSection").style.display = "none";
            document.getElementById("categoriesSection").style.display = "block";

            try {
                const result = await api.getCategories();
                const categories = result.categories;

                let html = `<div class="category-badges">`;
                categories.forEach(category => {
                    html += `
                        <span class="badge bg-primary" style="margin: 0.5rem; padding: 0.65rem 0.75rem;">
                            ${category}
                            <button
                                type="button"
                                onclick="deleteCategory('${category.replace(/'/g, "\\'")}')"
                                style="border: none; background: transparent; color: white; margin-left: 0.5rem; font-weight: 700;"
                                title="Удалить категорию"
                            >
                                ×
                            </button>
                        </span>
                    `;
                });
                html += `</div>`;

                document.getElementById("categoriesList").innerHTML = html;

            } catch (error) {
                document.getElementById("categoriesList").innerHTML = `
                    <p class="text-danger">Ошибка загрузки: ${error.message}</p>
                `;
            }
        }

        async function addCategory() {
            const input = document.getElementById("categoryInput");
            const category = input.value.trim();

            if (!category) {
                alert("Введите название категории");
                return;
            }

            try {
                await api.addCategory(category);
                input.value = "";
                showCategories();
                alert("Категория добавлена!");
            } catch (error) {
                alert(`Ошибка: ${error.message}`);
            }
        }

        async function deleteCategory(category) {
            if (!confirm(`Удалить категорию "${category}"?`)) {
                return;
            }

            try {
                await api.deleteCategory(category);
                showCategories();
                initDashboard();
                alert("Категория удалена!");
            } catch (error) {
                alert(`Ошибка: ${error.message}`);
            }
        }

        async function deleteRecipe(recipeId) {
            if (!confirm("Вы уверены? Это действие нельзя отменить.")) {
                return;
            }

            try {
                await api.deleteRecipe(recipeId);
                showRecipesList();
                alert("Рецепт удален!");
            } catch (error) {
                alert(`Ошибка: ${error.message}`);
            }
        }

        function findCountryFlag(countryCode) {
            return flagFromCountryCode(countryCode);
        }

        function toggleSidebar() {
            const sidebar = document.querySelector(".sidebar");
            const isOpen = sidebar.classList.toggle("open");
            document.body.classList.toggle("admin-menu-open", isOpen);
        }

        function closeSidebar() {
            document.querySelector(".sidebar").classList.remove("open");
            document.body.classList.remove("admin-menu-open");
        }

        function logout() {
            api.clearToken();
            window.location.href = "/admin/login.html";
        }

        document.addEventListener("click", (event) => {
            if (event.target === document.body && document.body.classList.contains("admin-menu-open")) {
                closeSidebar();
            }
        });

        document.querySelectorAll(".sidebar .nav-link").forEach(link => {
            link.addEventListener("click", closeSidebar);
        });

        // Initialize on page load
        window.addEventListener("DOMContentLoaded", initDashboard);
    </script>
</body>
</html>
