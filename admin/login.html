<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админку - Рецепты нашей семьи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #B51F36;
            --primary-dark: #7A1F2B;
            --secondary-color: #C9A227;
            --accent-color: #17201C;
            --light-bg: #F7F7F2;
            --border-color: #D9DDD6;
        }

        body {
            background:
                linear-gradient(90deg, rgba(23, 32, 28, 0.86), rgba(23, 32, 28, 0.68)),
                url("../images/recipe3.jpg") center/cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 24px 70px rgba(23, 32, 28, 0.32);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
        }

        .login-header {
            background: var(--accent-color);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
        }

        .login-header i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            color: var(--secondary-color);
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
        }

        .login-header p {
            margin-top: 0.5rem;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .login-form {
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-control {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.18);
            outline: none;
        }

        .btn-login {
            background: var(--primary-dark);
            border: none;
            color: white;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            transition: all 0.3s ease;
            font-size: 1rem;
            margin-top: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(122, 31, 43, 0.28);
            color: white;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            border-radius: 8px;
            border: none;
            margin-bottom: 1.5rem;
        }

        .spinner-border {
            color: var(--primary-color);
        }

        .login-footer {
            text-align: center;
            padding: 1.5rem 2.5rem;
            border-top: 1px solid #f0f0f0;
            font-size: 0.85rem;
            color: #606760;
        }

        .error-message {
            color: var(--primary-color);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        .form-group.error .form-control {
            border-color: var(--primary-color);
        }

        .form-group.error .error-message {
            display: block;
        }
    </style>
    <link rel="stylesheet" href="/admin/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-lock-open"></i>
            <h1>Админ-панель</h1>
            <p>Рецепты нашей семьи</p>
        </div>

        <div class="login-form">
            <div id="alertContainer"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i> Имя пользователя
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        placeholder="Введите имя пользователя"
                        required
                    >
                    <div class="error-message" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Пароль
                    </label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Введите пароль"
                        required
                    >
                    <div class="error-message" id="passwordError"></div>
                </div>

                <button
                    type="submit"
                    class="btn btn-login"
                    id="loginBtn"
                >
                    <i class="fas fa-sign-in-alt"></i> Войти
                </button>
            </form>
        </div>

        <div class="login-footer">
            <p>
                <i class="fas fa-info-circle"></i>
                Для тестирования используйте admin / admin123
            </p>
        </div>
    </div>

    <script src="/admin/js/api-client.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const loginBtn = document.getElementById("loginBtn");
            const alertContainer = document.getElementById("alertContainer");

            // Clear previous errors
            alertContainer.innerHTML = "";

            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Вход...';

            try {
                const response = await api.login(username, password);

                if (response.access_token) {
                    api.setToken(response.access_token);

                    // Show success message
                    alertContainer.innerHTML = `
                        <div class="alert alert-success" role="alert">
                            <i class="fas fa-check-circle"></i> Вход успешен! Перенаправление...
                        </div>
                    `;

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = "/admin/index.html";
                    }, 500);
                }
            } catch (error) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle"></i> Ошибка входа: ${error.message}
                    </div>
                `;

                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Войти';
            }
        }

        // Check if already logged in
        window.addEventListener("DOMContentLoaded", async () => {
            if (api.token) {
                try {
                    await api.verifyToken();
                    // Token is valid, redirect to dashboard
                    window.location.href = "/admin/index.html";
                } catch (error) {
                    // Token invalid, stay on login
                    api.clearToken();
                }
            }
        });
    </script>
</body>
</html>
