<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль - Рецепты нашей семьи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/admin/css/style.css">
    <style>
        body.auth-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.25rem;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0%, rgba(255, 255, 255, 0.76) 48%, rgba(255, 255, 255, 0.14) 100%),
                url("/images/hero-pickles.jpg") center/cover;
        }

        .login-container {
            max-width: 500px;
            width: 100%;
        }

        .login-header {
            padding: 3rem 2rem;
            color: white;
            text-align: center;
            background:
                linear-gradient(90deg, rgba(21, 23, 19, 0.86), rgba(32, 88, 61, 0.72)),
                url("/images/recipe3.jpg") center/cover;
        }

        .login-header i {
            display: block;
            margin-bottom: 1rem;
            color: var(--saffron);
            font-size: 3rem;
        }

        .login-header h1 {
            margin: 0;
            font-size: 2.15rem;
        }

        .login-form {
            padding: 2.5rem;
        }

        .login-form .btn-login {
            width: 100%;
            min-height: 56px;
            justify-content: center;
            background: var(--leaf) !important;
            border-color: var(--leaf) !important;
            color: white !important;
        }

        .login-form .btn-login:hover {
            background: var(--leaf-deep) !important;
            border-color: var(--leaf-deep) !important;
            color: white !important;
        }
    </style>
</head>
<body class="auth-page">
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-lock"></i>
            <h1>Новый пароль</h1>
            <p class="mb-0 mt-2">Придумайте новый пароль для входа</p>
        </div>

        <div class="login-form">
            <div id="alertContainer"></div>

            <form id="resetForm" onsubmit="resetPassword(event)">
                <div class="form-group">
                    <label for="password" class="form-label">Новый пароль</label>
                    <input id="password" type="password" class="form-control" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="passwordConfirm" class="form-label">Повторите пароль</label>
                    <input id="passwordConfirm" type="password" class="form-control" minlength="8" required>
                </div>

                <button id="submitBtn" type="submit" class="btn btn-login">
                    <span class="loading" style="display: none;">
                        <span class="spinner-border spinner-border-sm"></span>
                        Сохраняем...
                    </span>
                    <span class="submit-text">
                        <i class="fas fa-save"></i> Сохранить пароль
                    </span>
                </button>
            </form>
        </div>
    </div>

    <script src="/admin/js/api-client.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token") || "";

        async function resetPassword(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const passwordConfirm = document.getElementById("passwordConfirm").value;
            const submitBtn = document.getElementById("submitBtn");
            const loading = submitBtn.querySelector(".loading");
            const submitText = submitBtn.querySelector(".submit-text");
            const alertContainer = document.getElementById("alertContainer");

            alertContainer.innerHTML = "";

            if (!token) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        Ссылка сброса пароля некорректна.
                    </div>
                `;
                return;
            }

            if (password !== passwordConfirm) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        Пароли не совпадают.
                    </div>
                `;
                return;
            }

            submitBtn.disabled = true;
            loading.style.display = "inline";
            submitText.style.display = "none";

            try {
                await api.resetPassword(token, password);
                alertContainer.innerHTML = `
                    <div class="alert alert-success" role="alert">
                        <i class="fas fa-check-circle"></i>
                        Пароль изменен. Сейчас откроется страница входа.
                    </div>
                `;
                setTimeout(() => {
                    window.location.href = "/admin/login.html";
                }, 1200);
            } catch (error) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle"></i> Ошибка: ${error.message}
                    </div>
                `;
            } finally {
                submitBtn.disabled = false;
                loading.style.display = "none";
                submitText.style.display = "inline";
            }
        }
    </script>
</body>
</html>
