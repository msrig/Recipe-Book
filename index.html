<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга Рецептов</title>
    <!-- Подключение Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #ffffff;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .recipe-card {
            transition: transform .2s ease-in-out, box-shadow .2s ease-in-out;
            border: none;
            border-radius: 1rem;
            overflow: hidden;
        }
        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,.15);
        }
        .recipe-card img {
            height: 200px;
            object-fit: cover;
        }
        .recipe-card .card-body {
            background-color: #ffffff;
        }
        .footer {
            background-color: #343a40;
            color: white;
            padding: 2rem 0;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-light mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🍳 Книга Рецептов</a>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="container">
        <div class="text-center mb-5">
            <h1 class="display-4">Наши Лучшие Рецепты</h1>
            <p class="lead text-muted">Откройте для себя коллекцию проверенных и вкусных блюд на любой случай.</p>
        </div>

        <!-- Сетка рецептов -->
        <div class="row g-4">
            <!-- Рецепт 1: Борщ -->
            <div class="col-lg-4 col-md-6">
                <a href="recipe1.html" class="text-decoration-none">
                    <div class="card recipe-card h-100">
                        <img src="https://placehold.co/600x400/c92a2a/ffffff?text=Турша" class="card-img-top" alt="Изображение турши">
                        <div class="card-body">
                            <h5 class="card-title text-dark">Турша</h5>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Рецепт 2: Спагетти Карбонара -->
            <div class="col-lg-4 col-md-6">
                <a href="recipe2.html" class="text-decoration-none">
                    <div class="card recipe-card h-100">
                        <img src="https://placehold.co/600x400/fcc419/ffffff?text=Зеленый+Борщ" class="card-img-top" alt="Изображение зеленого борща">
                        <div class="card-body">
                            <h5 class="card-title text-dark">Зеленый Борщ</h5>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Рецепт 3: Салат Цезарь -->
            <div class="col-lg-4 col-md-6">
                <a href="recipe3.html" class="text-decoration-none">
                    <div class="card recipe-card h-100">
                        <img src="https://placehold.co/600x400/40c057/ffffff?text=Цезарь" class="card-img-top" alt="Изображение салата Цезарь">
                        <div class="card-body">
                            <h5 class="card-title text-dark">Салат "Цезарь" с курицей</h5>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Рецепт 4: Блины -->
            <div class="col-lg-4 col-md-6">
                <a href="recipe4.html" class="text-decoration-none">
                    <div class="card recipe-card h-100">
                        <img src="https://placehold.co/600x400/fd7e14/ffffff?text=Блины" class="card-img-top" alt="Изображение блинов">
                        <div class="card-body">
                            <h5 class="card-title text-dark">Тонкие Блины на молоке</h5>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Рецепт 5: Куриный суп -->
            <div class="col-lg-4 col-md-6">
                <a href="recipe5.html" class="text-decoration-none">
                    <div class="card recipe-card h-100">
                        <img src="https://placehold.co/600x400/868e96/ffffff?text=Куриный+Суп" class="card-img-top" alt="Изображение куриного супа">
                        <div class="card-body">
                            <h5 class="card-title text-dark">Куриный суп с лапшой</h5>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Рецепт 6: Шоколадный торт -->
            <div class="col-lg-4 col-md-6">
                <a href="recipe6.html" class="text-decoration-none">
                    <div class="card recipe-card h-100">
                        <img src="https://placehold.co/600x400/5f3dc4/ffffff?text=Торт" class="card-img-top" alt="Изображение шоколадного торта">
                        <div class="card-body">
                            <h5 class="card-title text-dark">Шоколадный торт "Прага"</h5>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <!-- Подвал -->
    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2024 Книга Рецептов. Все права защищены.</p>
        </div>
    </footer>

    <!-- Подключение Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
