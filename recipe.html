<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепт - Книга Рецептов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #17BEBB;
            --primary-dark: #0E8F8C;
            --accent-color: #2C3E50;
            --light-bg: #F8F9FA;
        }

        body {
            background: var(--light-bg);
            color: var(--accent-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--primary-dark) 100%);
            padding: 1rem 0;
        }

        .brand-link {
            color: white;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-link i {
            color: var(--primary-color);
        }

        .recipe-hero {
            background: white;
            border-bottom: 1px solid #e8ecef;
        }

        .recipe-image {
            width: 100%;
            height: min(52vh, 520px);
            object-fit: cover;
            background: #e8ecef;
        }

        .recipe-title {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .meta-pill {
            background: rgba(23, 190, 187, 0.12);
            color: var(--accent-color);
            border: 1px solid rgba(23, 190, 187, 0.25);
            border-radius: 8px;
            padding: 0.45rem 0.7rem;
            font-weight: 600;
        }

        .content-panel {
            background: white;
            border-radius: 8px;
            border: 1px solid #e8ecef;
            padding: 1.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .ingredient-list {
            margin: 0;
            padding-left: 1.2rem;
        }

        .ingredient-list li {
            margin-bottom: 0.55rem;
        }

        .preparation-text {
            white-space: pre-wrap;
            line-height: 1.7;
            margin: 0;
        }

        .back-link {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 1.25rem;
        }

        @media (max-width: 768px) {
            .recipe-title {
                font-size: 1.75rem;
            }

            .recipe-image {
                height: 320px;
            }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="container">
            <a class="brand-link" href="index.html">
                <i class="fas fa-utensils"></i>
                Книга Рецептов
            </a>
        </div>
    </nav>

    <main>
        <div id="recipePage">
            <div class="container py-5">
                <p class="text-muted">Загрузка рецепта...</p>
            </div>
        </div>
    </main>

    <script src="recipes-data.js"></script>
    <script src="country-utils.js"></script>
    <script>
        const API_BASE = window.location.protocol.startsWith("http") ? "" : "http://localhost:8000";

        async function loadRecipe(recipeId) {
            try {
                const response = await fetch(`${API_BASE}/api/recipes/${encodeURIComponent(recipeId)}`);
                if (!response.ok) throw new Error("API unavailable");
                return await response.json();
            } catch (error) {
                if (typeof recipes !== "undefined") {
                    return recipes.find(recipe => recipe.id === recipeId);
                }
                return null;
            }
        }

        function setText(parent, selector, value) {
            const element = parent.querySelector(selector);
            if (element) element.textContent = value || "";
        }

        function renderRecipe(recipe) {
            const page = document.getElementById("recipePage");

            if (!recipe) {
                page.innerHTML = `
                    <div class="container py-5">
                        <a href="index.html" class="back-link">
                            <i class="fas fa-arrow-left"></i>
                            Назад к рецептам
                        </a>
                        <div class="content-panel">
                            <p class="text-muted mb-0">Рецепт не найден.</p>
                        </div>
                    </div>
                `;
                return;
            }

            const countryFlag = flagFromCountryCode(recipe.country_code);
            document.title = `${recipe.title} - Книга Рецептов`;

            page.innerHTML = `
                <section class="recipe-hero">
                    <img class="recipe-image" alt="">
                    <div class="container py-4">
                        <a href="index.html" class="back-link">
                            <i class="fas fa-arrow-left"></i>
                            Назад к рецептам
                        </a>
                        <h1 class="recipe-title"></h1>
                        <div class="meta-row">
                            <span class="meta-pill country-meta"></span>
                            <span class="meta-pill category-meta"></span>
                        </div>
                        <p class="lead recipe-description mb-0"></p>
                    </div>
                </section>
                <section class="container py-4">
                    <div class="row g-4">
                        <div class="col-lg-4">
                            <div class="content-panel h-100">
                                <h2 class="section-title">Ингредиенты</h2>
                                <ul class="ingredient-list"></ul>
                            </div>
                        </div>
                        <div class="col-lg-8">
                            <div class="content-panel">
                                <h2 class="section-title">Приготовление</h2>
                                <p class="preparation-text"></p>
                            </div>
                        </div>
                    </div>
                </section>
            `;

            const image = page.querySelector(".recipe-image");
            image.src = recipe.image;
            image.alt = recipe.title;

            setText(page, ".recipe-title", recipe.title);
            setText(page, ".country-meta", `${countryFlag} ${recipe.country_origin}`);
            setText(page, ".category-meta", recipe.category);
            setText(page, ".recipe-description", recipe.description);
            setText(page, ".preparation-text", recipe.preparation);

            const ingredientList = page.querySelector(".ingredient-list");
            recipe.ingredients.forEach(ingredient => {
                const item = document.createElement("li");
                item.textContent = ingredient;
                ingredientList.appendChild(item);
            });
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const recipeId = params.get("id");
            const recipe = recipeId ? await loadRecipe(recipeId) : null;
            renderRecipe(recipe);
        });
    </script>
</body>
</html>
