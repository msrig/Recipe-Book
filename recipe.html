<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепт - Рецепты нашей семьи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body class="recipe-detail-page">
    <nav class="top-nav">
        <div class="container">
            <div class="nav-shell">
                <a class="brand-link" href="index.html">
                    <span class="brand-mark"><i class="fas fa-leaf"></i></span>
                    <span>Рецепты нашей семьи</span>
                </a>
            </div>
        </div>
    </nav>

    <main>
        <div id="recipePage">
            <div class="container py-5">
                <p class="loading-note">Загружаем рецепт...</p>
            </div>
        </div>
    </main>

    <script src="recipes-data.js"></script>
    <script src="country-utils.js"></script>
    <script>
        const API_BASE = (() => {
            const params = new URLSearchParams(window.location.search);
            const urlApiBase = params.get("api_base");
            if (urlApiBase) {
                return urlApiBase.replace(/\/$/, "");
            }

            const savedApiBase = localStorage.getItem("recipe_api_base");
            if (savedApiBase) {
                return savedApiBase.replace(/\/$/, "");
            }

            if (window.RECIPE_API_BASE) {
                return String(window.RECIPE_API_BASE).replace(/\/$/, "");
            }

            const localStaticPorts = new Set(["5173", "5174", "5500", "5501"]);
            if (
                window.location.hostname === "localhost" &&
                localStaticPorts.has(window.location.port)
            ) {
                return "http://127.0.0.1:8000";
            }

            return "";
        })();

        async function loadRecipe(recipeId) {
            try {
                const response = await fetch(`${API_BASE}/api/recipes/${encodeURIComponent(recipeId)}`);
                if (!response.ok) throw new Error("API unavailable");
                return await response.json();
            } catch (error) {
                if (typeof recipes !== "undefined") {
                    return recipes.find(recipe => recipe.id === recipeId);
                }
                return null;
            }
        }

        function setText(parent, selector, value) {
            const element = parent.querySelector(selector);
            if (element) element.textContent = value || "";
        }

        function preparationSteps(preparation = "") {
            return preparation
                .split(/\n+|(?=\d+\.\s+)/)
                .map(step => step.replace(/^\d+\.\s*/, "").trim())
                .filter(Boolean);
        }

        function withImageVersion(imagePath, updatedAt) {
            if (!imagePath) return "";
            if (!updatedAt) return imagePath;

            const version = encodeURIComponent(String(updatedAt));
            const separator = imagePath.includes("?") ? "&" : "?";
            return `${imagePath}${separator}v=${version}`;
        }

        function renderRecipe(recipe) {
            const page = document.getElementById("recipePage");

            if (!recipe) {
                page.innerHTML = `
                    <section class="recipe-content-section">
                        <div class="container">
                            <a href="index.html" class="back-link">
                                <i class="fas fa-arrow-left"></i>
                                Назад к рецептам
                            </a>
                            <div class="content-panel">
                                <p class="text-muted mb-0">Рецепт не найден.</p>
                            </div>
                        </div>
                    </section>
                `;
                return;
            }

            const countryFlag = flagFromCountryCode(recipe.country_code);
            document.title = `${recipe.title} - Рецепты нашей семьи`;

            page.innerHTML = `
                <section class="recipe-hero">
                    <img class="recipe-image" alt="">
                    <div class="recipe-hero-body">
                        <div class="container">
                            <a href="index.html" class="back-link">
                                <i class="fas fa-arrow-left"></i>
                                Назад к рецептам
                            </a>
                            <p class="eyebrow">Рецепт дня</p>
                            <h1 class="recipe-title"></h1>
                            <div class="meta-row">
                                <span class="meta-pill country-meta"></span>
                                <span class="meta-pill category-meta"></span>
                                <a class="meta-pill owner-meta" href="#"></a>
                            </div>
                            <p class="recipe-description mb-0"></p>
                        </div>
                    </div>
                </section>
                <section class="recipe-content-section">
                    <div class="container">
                        <div class="recipe-layout">
                            <aside class="content-panel ingredients-panel">
                                <h2 class="section-title">Ингредиенты</h2>
                                <ul class="ingredient-list"></ul>
                            </aside>
                            <article class="content-panel">
                                <h2 class="section-title">Приготовление</h2>
                                <ol class="preparation-list"></ol>
                                <p class="preparation-text d-none"></p>
                            </article>
                        </div>
                    </div>
                </section>
            `;

            const image = page.querySelector(".recipe-image");
            image.src = withImageVersion(recipe.image, recipe.updated_at);
            image.alt = recipe.title;

            setText(page, ".recipe-title", recipe.title);
            setText(page, ".country-meta", `${countryFlag} ${recipe.country_origin}`);
            setText(page, ".category-meta", recipe.category);
            setText(page, ".recipe-description", recipe.description);

            const ownerMeta = page.querySelector(".owner-meta");
            if (recipe.owner_username) {
                ownerMeta.textContent = `Автор: ${recipe.owner_username}`;
                ownerMeta.href = `index.html?user=${encodeURIComponent(recipe.owner_username)}`;
            } else {
                ownerMeta.remove();
            }

            const ingredientList = page.querySelector(".ingredient-list");
            (recipe.ingredients || []).forEach(ingredient => {
                const item = document.createElement("li");
                item.textContent = ingredient;
                ingredientList.appendChild(item);
            });

            const steps = preparationSteps(recipe.preparation);
            const preparationList = page.querySelector(".preparation-list");
            const preparationText = page.querySelector(".preparation-text");

            if (steps.length > 1) {
                steps.forEach(step => {
                    const item = document.createElement("li");
                    item.textContent = step;
                    preparationList.appendChild(item);
                });
            } else {
                preparationList.classList.add("d-none");
                preparationText.classList.remove("d-none");
                preparationText.textContent = recipe.preparation || "";
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const recipeId = params.get("id");
            const recipe = recipeId ? await loadRecipe(recipeId) : null;
            renderRecipe(recipe);
        });
    </script>
</body>
</html>
