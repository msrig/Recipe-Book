services:
  - type: web
    name: recipe-book
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: production
      - key: DATA_DIR
        value: /var/data/backend/data
      - key: IMAGES_DIR
        value: /var/data/images
      - key: OPENAI_MODEL
        value: gpt-5.2
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
    disk:
      name: recipe-book-storage
      mountPath: /var/data
      sizeGB: 1
