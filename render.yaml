services:
  - type: web
    name: recipe-book
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: production
      - key: DATA_DIR
        value: /var/data/backend/data
      - key: IMAGES_DIR
        value: /var/data/images
      - key: OPENAI_MODEL
        value: gpt-5.2
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: true
      - key: PASSWORD_RESET_EXPIRE_MINUTES
        value: 60
    disk:
      name: recipe-book-storage
      mountPath: /var/data
      sizeGB: 1
