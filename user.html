<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход к книге рецептов</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        const username = params.get("u") || params.get("user") || params.get("owner");
        const targetParams = new URLSearchParams();
        if (username) targetParams.set("user", username);
        if (params.get("lang")) targetParams.set("lang", params.get("lang"));
        const target = `/index.html${targetParams.toString() ? `?${targetParams.toString()}` : ""}`;
        window.location.replace(target);
    </script>
</head>
<body>
    <p>Переходим к книге рецептов...</p>
</body>
</html>
